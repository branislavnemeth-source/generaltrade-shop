<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f48"/>
      <stop offset="50%" stop-color="#0f2a5a"/>
      <stop offset="100%" stop-color="#061533"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d27a"/>
      <stop offset="50%" stop-color="#d4a64a"/>
      <stop offset="100%" stop-color="#a07614"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a64a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d4a64a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative glow -->
  <circle cx="980" cy="180" r="380" fill="url(#glow)"/>
  <circle cx="120" cy="540" r="280" fill="url(#glow)" opacity="0.6"/>

  <!-- Decorative grid lines -->
  <g stroke="#1d3a78" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
  </g>

  <!-- Top eyebrow -->
  <g transform="translate(80,110)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <text x="110" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="14"
          fill="url(#gold)" letter-spacing="3">PRÉMIOVÉ LICENCIE</text>
  </g>

  <!-- Logo mark large -->
  <g transform="translate(80,200)">
    <path d="M65 0 L130 18 L130 72 C130 108 100 138 65 150 C30 138 0 108 0 72 L0 18 Z"
          fill="#0b1f48" stroke="url(#gold)" stroke-width="3"/>
    <g fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round">
      <circle cx="50" cy="78" r="14"/>
      <line x1="63" y1="78" x2="105" y2="78"/>
      <line x1="92" y1="78" x2="92" y2="90"/>
      <line x1="100" y1="78" x2="100" y2="90"/>
    </g>
    <text x="65" y="50" text-anchor="middle" font-family="Georgia, serif"
          font-weight="700" font-size="24" fill="url(#gold)">G</text>
  </g>

  <!-- Main heading -->
  <g transform="translate(260,240)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
          font-size="72" fill="url(#gold)">Generaltrade</text>
    <text x="0" y="80" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
          font-size="72" fill="#ffffff">Licencie</text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="430" font-family="Georgia, serif" font-size="28" fill="#cdd6e8">
    Windows · Office · Steam · VMware
  </text>
  <text x="80" y="470" font-family="Georgia, serif" font-size="22" fill="#8a9bbf">
    Digitálne kľúče s okamžitým doručením
  </text>

  <!-- Bottom badges -->
  <g transform="translate(80,520)" font-family="Georgia, serif" font-size="16">
    <rect x="0" y="0" width="200" height="44" rx="22" fill="#1d3a78" stroke="url(#gold)" stroke-width="1"/>
    <text x="100" y="28" text-anchor="middle" fill="url(#gold)">⚡ Instant doručenie</text>

    <rect x="220" y="0" width="200" height="44" rx="22" fill="#1d3a78" stroke="url(#gold)" stroke-width="1"/>
    <text x="320" y="28" text-anchor="middle" fill="url(#gold)">✓ Overený partner</text>

    <rect x="440" y="0" width="200" height="44" rx="22" fill="#1d3a78" stroke="url(#gold)" stroke-width="1"/>
    <text x="540" y="28" text-anchor="middle" fill="url(#gold)">🛡 SK podpora</text>
  </g>

  <!-- URL -->
  <text x="1120" y="590" text-anchor="end" font-family="Georgia, serif" font-size="20"
        fill="url(#gold)" letter-spacing="2">generaltrade.shop</text>
</svg>
