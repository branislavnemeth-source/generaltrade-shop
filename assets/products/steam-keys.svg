<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1933"/>
      <stop offset="100%" stop-color="#1d3a78"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7d27a"/>
      <stop offset="100%" stop-color="#a07614"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#1d3a78" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a1933" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg)"/>
  <rect width="500" height="500" fill="url(#glow)"/>
  
  <!-- Hlavný kľúč -->
  <g transform="translate(250 250)">
    <!-- Hlavička kľúča (kruh s otvorom) -->
    <circle cx="-90" cy="0" r="70" fill="none" stroke="url(#gold)" stroke-width="18"/>
    <circle cx="-90" cy="0" r="22" fill="url(#bg)" stroke="url(#gold)" stroke-width="6"/>
    <!-- Telo kľúča -->
    <rect x="-20" y="-12" width="160" height="24" fill="url(#gold)" rx="4"/>
    <!-- Zúbky -->
    <rect x="100" y="12" width="18" height="22" fill="url(#gold)"/>
    <rect x="125" y="12" width="14" height="32" fill="url(#gold)"/>
  </g>

  <!-- Text STEAM KEYS -->
  <text x="250" y="400" text-anchor="middle" font-family="DejaVu Serif, serif" font-weight="bold" font-size="52" fill="url(#gold)" letter-spacing="3">STEAM KEYS</text>
  <text x="250" y="445" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#cdd9ef" letter-spacing="2">DIGITAL DELIVERY</text>
</svg>
